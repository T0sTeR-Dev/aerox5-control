[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aerox5-control"
version = "0.1.0"
description = "Independent Linux discovery and configuration utility for the Aerox 5 Wireless"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["hidapi>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
aerox5-control-cli = "aerox5_control.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
